<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 素材管理器 V2 · 安全合成 UI 预览</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;--page:#eef1f5;--paper:#fff;--panel:#fafbfc;--sidebar:#f8f9fb;--line:#e7eaf0;--text:#242b3b;--muted:#8390a3;--hover:#edf2fa;--accent:#355fd6;--pale:#eaf0ff;--shadow:0 18px 60px rgba(50,61,92,.1);color:var(--text);color-scheme:light}
body.dark{--page:#10151c;--paper:#1a202a;--panel:#1e2531;--sidebar:#19202b;--line:#333d4c;--text:#eef2f8;--muted:#a5afc2;--hover:#293344;--accent:#91b2ff;--pale:#293b5d;--shadow:0 18px 60px #0005;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--page);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #79a0ff;outline-offset:2px}button{border:0}.wrap{width:min(1670px,100%);margin:0 auto;padding:22px 24px 28px}.heading{display:flex;gap:18px;align-items:center;justify-content:space-between;margin:0 4px 14px}.heading h1{font-size:23px;letter-spacing:-.5px;margin:0 0 5px;font-weight:700}.heading .sub{font-size:12px;color:var(--muted);margin:0}.flag{color:var(--accent);font-size:11px;font-weight:700;background:var(--pale);border-radius:99px;padding:8px 12px;white-space:nowrap}.choice-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:0 0 15px}.choice-group{background:var(--paper);border:1px solid var(--line);padding:13px 14px 14px;border-radius:14px}.choice-title{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:10px}.choice-row{display:flex;gap:6px;flex-wrap:wrap}.choice-row button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:var(--text);font-size:12px}.choice-row button.active{background:var(--pale);color:var(--accent);border-color:var(--accent);font-weight:700}.app{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;background:var(--paper);min-height:720px;overflow:hidden}.toolbar{display:flex;gap:12px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);min-height:71px}.logo{width:36px;height:36px;background:linear-gradient(145deg,#ffad5d,#f06a2b);border-radius:11px;color:#fff;font-size:20px;font-weight:800;display:grid;place-items:center}.brand{min-width:164px}.brand b{font-size:14px}.brand small{font-size:10px;color:var(--muted);display:block;margin-top:4px}.search-wrap{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 13px;width:min(490px,42vw);margin-left:28px}.search-wrap input{background:transparent;border:0;outline:none;font-size:12px;flex:1;min-width:30px;color:var(--text)}.search-wrap input::placeholder{color:var(--muted)}.spacer{flex:1}.toolbtn{background:var(--paper);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 12px;font-size:12px;white-space:nowrap}.toolbtn.primary{background:#2a354b;color:#fff;border-color:transparent}.toolbtn:hover,.chip:hover,.nav button:hover{background:var(--hover)}.toolbtn.primary:hover{background:#3c4b64}.appbody{display:flex;min-height:650px}.nav{flex:0 0 205px;background:var(--sidebar);border-right:1px solid var(--line);padding:20px 11px;display:flex;flex-direction:column}.navtitle{font-size:10px;font-weight:750;letter-spacing:.07em;color:var(--muted);padding:14px 11px 9px}.nav button{display:flex;align-items:center;justify-content:space-between;width:100%;border-radius:9px;background:transparent;color:var(--text);padding:10px 11px;font-size:12px;text-align:left;gap:8px}.nav button.active{background:var(--pale);color:var(--accent);font-weight:700}.nav button .left{display:flex;gap:10px;min-width:0;align-items:center}.nav button .left span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav button .num{font-size:10px;color:var(--muted)}.nav .split{border-top:1px solid var(--line);margin:13px 9px 1px}.nav .addcat{border:1px dashed #a8b9d8;color:var(--accent);justify-content:center;margin:11px 0;background:var(--paper)}.navfoot{margin-top:auto;color:var(--muted);font-size:10px;line-height:1.65;padding:13px 9px}.main{flex:1;min-width:0;max-height:760px;overflow-y:auto;padding:21px 20px 28px}.maintop{display:flex;align-items:center;justify-content:space-between;gap:10px}.maintop h2{font-size:21px;letter-spacing:-.5px;margin:0}.maintop p{font-size:11px;color:var(--muted);margin:5px 0 0}.viewbtns{display:flex;gap:5px}.viewbtns button{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--muted)}.viewbtns button.active{background:var(--pale);color:var(--accent);border-color:#8fa9eb}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:19px 0 15px}.chip{font-size:11px;color:var(--muted);background:var(--paper);padding:8px 11px;border-radius:8px;border:1px solid var(--line)}.chip.active{background:var(--pale);color:var(--accent);border-color:#8fa9eb}.hintline{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:15px;display:flex;align-items:center;gap:8px;min-height:18px}.hintline b{font-weight:600;color:var(--text)}.batchbar{background:var(--pale);border:1px solid #a6baf1;border-radius:10px;display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:13px;color:var(--text);font-size:11px;flex-wrap:wrap}.batchbar select{background:var(--paper);color:var(--text);padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:11px}.batchbar button{border-radius:7px;padding:8px 10px;font-size:11px;background:#2e57b2;color:#fff}.assetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px}.asset{background:var(--paper);border:1px solid var(--line);border-radius:11px;overflow:hidden;position:relative;transition:border-color .15s,box-shadow .15s;cursor:pointer;min-width:0}.asset:hover{border-color:#9fb2de;box-shadow:0 8px 22px #5e719a19}.asset.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.cover{height:176px;position:relative;background:#e4e8ef;overflow:hidden}.cover img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .2s}.asset:hover .cover img{transform:scale(1.035)}.mark{position:absolute;top:9px;left:9px;z-index:2;background:#ffffffdc;border:1px solid #ffffffae;border-radius:6px;padding:5px 7px;color:#36475d;font-size:10px;box-shadow:0 2px 5px #0001}.multi{position:absolute;right:8px;top:8px;z-index:2;width:22px;height:22px;accent-color:#3565dd;cursor:pointer}.assetinfo{padding:11px 11px 12px}.aname{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.origin{font-size:10px;color:var(--muted);padding-top:5px}.tags{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}.tag{font-size:10px;border-radius:5px;padding:4px 6px;background:#eef2f9;color:#596b87}.tag:nth-child(2){background:#e9f5f1;color:#418674}.assetfoot{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}.heart{background:transparent;color:#8795ac;font-size:18px;padding:0 4px}.heart.on{color:#e46b72}.inspector{flex:0 0 250px;border-left:1px solid var(--line);background:var(--sidebar);padding:21px 15px;overflow-y:auto;max-height:760px}.inspector h3{font-size:13px;margin:0 0 12px}.inspectCover{height:175px;background:var(--panel);border-radius:10px;overflow:hidden}.inspectCover img{width:100%;height:100%;object-fit:contain}.detailName{font-size:14px;font-weight:750;margin:14px 0 6px;line-height:1.4}.small{font-size:11px;color:var(--muted);overflow-wrap:anywhere;line-height:1.6}.rule{border-top:1px solid var(--line);margin:15px 0}.fieldLabel{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:8px}.inspector select{width:100%;padding:10px;background:var(--paper);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:11px}.inspectAction{width:100%;background:#2a354b;color:white;border-radius:8px;padding:11px 10px;margin-top:13px;font-size:11px}.inspectNote{font-size:10px;color:var(--muted);margin-top:10px;line-height:1.7}.empty{text-align:center;padding:75px 20px;color:var(--muted);font-size:13px;grid-column:1/-1}.footer{display:flex;justify-content:space-between;gap:14px;align-items:center;margin:13px 4px 0;color:var(--muted);font-size:11px;flex-wrap:wrap}.export{color:white;background:#2b3650;border-radius:9px;padding:11px 14px;font-size:12px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,22px);padding:12px 18px;background:#27364f;color:#fff;border-radius:10px;box-shadow:0 10px 33px #14203b40;opacity:0;pointer-events:none;z-index:100;transition:.25s;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}
body.dark .tag{background:#333f51;color:#c9d3e2}body.dark .tag:nth-child(2){background:#274840;color:#94d8c1}body.dark .mark{background:#242b37db;color:#ebf3ff;border-color:#647080}body.dark .multi{filter:brightness(.95)}
.app.listmode .assetgrid{display:flex;flex-direction:column;gap:7px}.app.listmode .asset{display:flex;height:97px;align-items:center}.app.listmode .cover{width:138px;height:96px;flex:none}.app.listmode .assetinfo{flex:1;padding:12px 17px}.app.listmode .assetfoot{border:0;padding:0;margin:4px 0 0}.app.listmode .multi{right:10px}.app.listmode .assetinfo .tags{margin-top:6px}.app.listmode .main{background:var(--panel)}
.app.boardmode .inspector{display:none}.app.boardmode .nav{flex-basis:175px}.app.boardmode .assetgrid{columns:4;display:block;column-gap:14px}.app.boardmode .asset{display:inline-block;width:100%;break-inside:avoid;margin-bottom:13px}.app.boardmode .cover{height:auto;aspect-ratio:var(--ar)}.app.boardmode .cover img{height:100%;width:100%}.app.boardmode .assetinfo{padding:10px 12px}.app.boardmode .assetinfo .tags,.app.boardmode .assetfoot{display:none}.app.boardmode .main{padding:21px 24px}.app.boardmode .assetgrid .asset:hover .cover img{transform:none}
@media (max-width:1230px){.nav{flex-basis:175px}.inspector{flex-basis:215px}.assetgrid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}.search-wrap{margin-left:6px}}
@media (max-width:930px){.wrap{padding:12px}.choice-panel{grid-template-columns:1fr}.inspector{display:none}.nav{flex-basis:150px}.toolbar{flex-wrap:wrap}.search-wrap{margin-left:0;width:100%;order:2}.brand{min-width:120px}.app.boardmode .assetgrid{columns:3}}
@media (max-width:560px){.heading{display:block}.flag{display:inline-block;margin-top:9px}.nav{flex-basis:115px;padding:10px 5px}.nav button{font-size:11px;padding:10px 5px}.navtitle{padding-left:5px}.main{padding:13px 10px}.assetgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.cover{height:120px}.assetinfo{padding:9px}.app.boardmode .assetgrid{columns:2}.app.boardmode .nav{flex-basis:105px}.toolbar{gap:7px;padding:12px}.toolbtn{padding:9px}.app.listmode .cover{width:95px}.nav button .num{display:none}}

/* Desktop candidate: reuse original UI CSS, not the design-choice chrome. */
body{background:var(--page)}.wrap{width:100%;max-width:none;padding:8px}.app{border-radius:12px;min-height:calc(100vh - 16px)}
.appbody{min-height:calc(100vh - 136px)}.nav{min-height:calc(100vh - 136px)}.main{max-height:calc(100vh - 136px)}
.app.boardmode .assetgrid{columns:4}.app.boardmode .nav{flex-basis:175px}
.native-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-height:54px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.native-actions .toolbtn{padding:7px 11px}.native-actions .mode{flex:1;text-align:right;font-size:11px}
#updateDialog{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:#0f19255e;padding:16px}
#updateDialog.open{display:flex}#updateDialog .panel{max-width:435px;width:100%;background:var(--paper);color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:24px}
#updateDialog h2{margin:0 0 14px;font-size:18px}#updateDialog p{font-size:13px;line-height:1.7;white-space:pre-line;overflow-wrap:anywhere}
#updateDialog .row{margin-top:18px;display:flex;justify-content:flex-end;gap:10px}#updateDialog button:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:850px){.native-actions .mode{width:100%;text-align:left}.app.boardmode .assetgrid{columns:3}}@media(max-width:600px){.app.boardmode .assetgrid{columns:2}}
.app.boardmode .assetgrid{position:relative;display:block;columns:auto;column-gap:normal}
.app.boardmode .asset{position:absolute;display:block;margin:0;break-inside:auto}
.app.boardmode .cover{height:auto;aspect-ratio:var(--ar)}
.app.boardmode .cover img{object-fit:contain;transform:none}
.asset,.inspectCover{user-select:none}.cover img,.inspectCover img{-webkit-user-drag:none}
.app.gridmode .assetgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--card-size,260px)),var(--card-size,260px)))}
.app.listmode .cover{width:calc(var(--card-size,260px) * .55);min-height:calc(var(--card-size,260px) * .4)}
.asset .aname{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-height:1.45;max-height:2.9em;overflow:hidden;overflow-wrap:anywhere}
.asset .origin{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.boardmode .asset.no-preview .cover{aspect-ratio:2.2}
.app.boardmode .asset.reference-preview .cover{aspect-ratio:4/3}
.preview-filters,.library-pager{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.library-pager{margin-bottom:12px}.library-pager[hidden]{display:none}
</style>
</head><body>

<div class="wrap">
<div class="app" id="app">
  <header class="toolbar"><div class="logo">T</div><div class="brand"><b>3D 素材管理器</b><small>本地素材 · V2 UI 开发预览</small></div><label class="search-wrap"><span>⌕</span><input id="search" type="search" placeholder="搜索模型名称、分类、文件夹…" autocomplete="off"></label><div class="spacer"></div><button class="toolbtn" id="theme">☾ 深色</button><button class="toolbtn" id="checkUpdate">↻ 检查更新</button><button class="toolbtn primary" id="importFolder">＋ 导入素材文件夹</button></header>
  <div class="native-actions"><button class="toolbtn" id="pasteCover">▣ 粘贴封面</button><button class="toolbtn" id="findImage">▧ 以图搜图</button><button class="toolbtn" id="showAll">▤ 全部素材</button><button class="toolbtn" id="locateFile">✧ 定位原文件</button><span class="mode" id="nativeMode">仅合成数据 · 未接入 Windows 本地模型</span></div>
  <div class="appbody">
   <aside class="nav"><div class="navtitle">素材库</div><div id="special-nav"></div><div class="split"></div><div class="navtitle" id="nav-label">虚拟分类</div><div id="category-nav"></div><button class="addcat" id="addCategory">＋ 新建虚拟分类</button><div class="navfoot">此页面完全使用合成测试封面。<br>真实模型将在 Windows 原生版接入。</div></aside>
   <main class="main"><div class="maintop"><div><h2 id="pageName">全部素材</h2><p id="pageCount">加载中…</p></div><div class="viewbtns"><button id="gridBtn" class="active" title="网格素材墙">▦</button><button id="listBtn" title="文件列表">☷</button><button id="boardBtn" title="瀑布流">▤</button></div></div><div class="chips" id="chips"></div><div class="hintline" id="hintline"></div><div class="batchbar" id="batchbar" style="display:none"></div><div class="assetgrid" id="assets"></div></main>
   <aside class="inspector" id="inspector"><h3>素材详情</h3><div id="detail"></div></aside>
  </div>
 </div>
</div><div id="updateDialog" role="dialog" aria-modal="true" aria-labelledby="updateTitle"><div class="panel"><h2 id="updateTitle">检查软件更新</h2><p id="updateStatus" role="status">准备检查更新…</p><div class="row"><button class="toolbtn" id="closeUpdate">关闭</button><button class="toolbtn primary" id="nativeUpdate" disabled>立即更新并重启</button></div></div></div><div class="toast" id="toast" role="status"></div>

<script src="../update/bridge.js"></script>
<script src="./app.js"></script>
</body></html>
