<!doctype html>
<html lang="zh-CN">

<meta charset="utf-8">

<title>3D 素材管理器 V2 · Windows 预览</title>
<style>
:root{
  font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --page:#e9edf3;--paper:#ffffff;--panel:#f7f9fc;--sidebar:#f4f7fb;
  --line:#dfe5ee;--line-strong:#cbd5e3;--text:#182033;--muted:#59677d;
  --subtle:#667085;--hover:#edf3fc;--pressed:#e3ebf8;--accent:#2563eb;
  --accent-hover:#1d4ed8;--pale:#eaf1ff;--danger:#b42318;--success:#167047;
  --shadow:0 16px 44px rgba(31,47,75,.10);--shadow-card:0 8px 22px rgba(39,57,88,.10);
  --radius-sm:6px;--radius-md:9px;--radius-lg:12px;--focus:#1d4ed8;
  color:var(--text);color-scheme:light;
}
body.dark{
  --page:#10151c;--paper:#181e27;--panel:#1e2632;--sidebar:#171e28;
  --line:#303b4a;--line-strong:#465267;--text:#f1f5fb;--muted:#b3bfd0;
  --subtle:#98a6ba;--hover:#273243;--pressed:#303d51;--accent:#8fb0ff;
  --accent-hover:#adc4ff;--pale:#23365c;--danger:#ffaca5;--success:#7ed7aa;
  --shadow:0 18px 48px rgba(0,0,0,.38);--shadow-card:0 10px 26px rgba(0,0,0,.28);
  --focus:#9bb8ff;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;min-height:0;overflow:hidden}
body{margin:0;background:var(--page);color:var(--text);font-size:13px;line-height:1.45}
button,input,select{font:inherit}
button{border:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.48}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;
}
.icon-defs{position:absolute;width:0;height:0;overflow:hidden}
.icon{width:16px;height:16px;flex:0 0 16px;display:inline-block;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wrap{width:100%;height:100%;padding:8px;display:flex;flex-direction:column}
.app{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.toolbar{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.logo{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,#ffad5d,#ef6a2d);color:#fff;font-size:18px;font-weight:750;box-shadow:0 4px 12px rgba(221,99,39,.2)}
.brand{min-width:158px}.brand b{display:block;font-size:14px;font-weight:650;letter-spacing:-.1px}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.search-wrap{display:flex;align-items:center;gap:9px;width:clamp(250px,34vw,520px);height:38px;margin-left:10px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--panel);color:var(--muted);transition:border-color .15s,box-shadow .15s}
.search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.search-wrap input{width:100%;min-width:30px;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}
.search-wrap input::placeholder{color:var(--subtle)}
.spacer{flex:1}
.toolbtn{min-height:34px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--text);font-size:12px;font-weight:500;white-space:nowrap;transition:background .14s,border-color .14s,color .14s}
.toolbtn:not(:disabled):hover,.chip:not(:disabled):hover,.nav button:not(:disabled):hover,.viewbtns button:not(:disabled):hover{background:var(--hover);border-color:var(--line-strong)}
.toolbtn:not(:disabled):active,.chip:not(:disabled):active,.nav button:not(:disabled):active,.viewbtns button:not(:disabled):active{background:var(--pressed)}
.toolbtn.primary{background:#25324a;color:#fff;border-color:#25324a}.toolbtn.primary:not(:disabled):hover{background:#33435f;border-color:#33435f}
body.dark .toolbtn.primary{background:#dbe5f6;color:#162033;border-color:#dbe5f6}
.native-actions{display:flex;align-items:center;gap:7px;min-height:46px;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0}
.native-actions .toolbtn{min-height:32px;padding:6px 10px}
.native-actions .mode{display:inline-flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0;margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--subtle);box-shadow:0 0 0 3px color-mix(in srgb,var(--subtle) 16%,transparent)}
.mode[data-state="connecting"] .status-dot{background:#b7791f}.mode[data-state="limited"] .status-dot{background:#b7791f}.mode[data-state="connected"] .status-dot{background:var(--success)}.mode[data-state="error"] .status-dot{background:var(--danger)}
.appbody{flex:1;min-height:0;display:grid;grid-template-columns:188px minmax(0,1fr) 248px;overflow:hidden}
.nav,.inspector{min-height:0;overflow-y:auto;scrollbar-gutter:stable}
.nav{display:flex;flex-direction:column;padding:12px 9px;background:var(--sidebar);border-right:1px solid var(--line)}
.navtitle{padding:11px 10px 7px;color:var(--subtle);font-size:11px;font-weight:650}
.nav button{width:100%;min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);font-size:12px;text-align:left}
.nav button.active{background:var(--pale);border-color:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);font-weight:650}
.nav button .left{min-width:0;display:flex;align-items:center;gap:9px}.nav button .left span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav button .num{color:var(--subtle);font-size:11px;font-variant-numeric:tabular-nums}
.nav .split{margin:10px 9px 2px;border-top:1px solid var(--line)}
.nav .addcat{justify-content:center;margin:10px 0 2px;border:1px dashed var(--line-strong);color:var(--muted);background:var(--paper)}
.navfoot{margin-top:auto;padding:13px 10px 7px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.65}
.main{min-width:0;min-height:0;overflow-y:auto;scrollbar-gutter:stable;padding:20px 20px 28px;background:var(--paper)}
.maintop{display:flex;align-items:center;justify-content:space-between;gap:14px}
.maintop h2{margin:0;color:var(--text);font-size:21px;font-weight:680;letter-spacing:-.45px}.maintop p{margin:4px 0 0;color:var(--muted);font-size:11px}
.viewbtns{display:flex;gap:5px}.viewbtns button{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--muted)}
.viewbtns button.active{border-color:color-mix(in srgb,var(--accent) 52%,var(--line));background:var(--pale);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 12px}.chip{min-height:32px;padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--muted);font-size:11px}
.chip.active{border-color:color-mix(in srgb,var(--accent) 48%,var(--line));background:var(--pale);color:var(--accent);font-weight:650}
.hintline{min-height:36px;display:flex;align-items:center;margin-bottom:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font-size:11px;line-height:1.5}
.hintline b{color:var(--text);font-weight:600}
.batchbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:13px;padding:9px 11px;border:1px solid color-mix(in srgb,var(--accent) 36%,var(--line));border-radius:9px;background:var(--pale);color:var(--text);font-size:11px}
.batchbar select{min-height:32px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--text);font-size:11px}.batchbar button{min-height:32px;padding:6px 10px;border-radius:7px;background:var(--accent);color:#fff;font-size:11px}
.assetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-items:start}
.asset{position:relative;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--paper);cursor:pointer;transition:border-color .14s,box-shadow .14s,background .14s}
.asset:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:var(--shadow-card)}
.asset.selected{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 24%,transparent),var(--shadow-card)}
.cover{position:relative;height:auto;aspect-ratio:4/3;overflow:hidden;background:var(--panel);border-bottom:1px solid var(--line)}
.cover img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;transition:filter .15s}
.asset:hover .cover img{filter:saturate(1.04) contrast(1.02)}
.mark{position:absolute;top:8px;left:8px;z-index:2;max-width:calc(100% - 48px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 7px;border:1px solid rgba(255,255,255,.74);border-radius:6px;background:rgba(255,255,255,.90);color:#33445b;font-size:10px;box-shadow:0 2px 8px rgba(31,45,67,.10)}
.multi{position:absolute;right:8px;top:8px;z-index:2;width:22px;height:22px;margin:0;accent-color:var(--accent);cursor:pointer}
.assetinfo{padding:11px 12px 12px}.aname{overflow:hidden;color:var(--text);font-size:12px;font-weight:650;text-overflow:ellipsis;white-space:nowrap}.origin{padding-top:4px;color:var(--muted);font-size:10px}.tags{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:9px}.tag{padding:3px 6px;border-radius:5px;background:#edf2fa;color:#4d607d;font-size:10px}.tag:nth-child(2){background:#e8f4ef;color:#39765f}
.assetfoot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.model-state{display:inline-flex;align-items:center;gap:5px}.model-state .icon{width:13px;height:13px}
.heart{width:28px;height:28px;display:grid;place-items:center;padding:0;border-radius:7px;background:transparent;color:var(--muted)}.heart.on{color:#cf4251}.heart.on .icon{fill:currentColor}
body.dark .tag{background:#2c384a;color:#d0daea}body.dark .tag:nth-child(2){background:#25453d;color:#a6dec9}body.dark .mark{border-color:#556174;background:rgba(29,36,47,.92);color:#eef4ff}
.inspector{padding:18px 15px 22px;border-left:1px solid var(--line);background:var(--sidebar)}
.inspector h3{margin:0 0 13px;font-size:13px;font-weight:680}.inspectCover{height:auto;aspect-ratio:4/3;overflow:hidden;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.inspectCover img{width:100%;height:100%;object-fit:cover}
.detailName{margin:13px 0 5px;color:var(--text);font-size:14px;font-weight:680;line-height:1.4}.small{overflow-wrap:anywhere;color:var(--muted);font-size:11px;line-height:1.65}.rule{margin:14px 0;border-top:1px solid var(--line)}.fieldLabel{margin-bottom:7px;color:var(--muted);font-size:10px;font-weight:650}.inspector select{width:100%;min-height:34px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--text);font-size:11px}
.unavailable-callout{display:flex;align-items:flex-start;gap:8px;margin-top:13px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font-size:11px;line-height:1.55}.unavailable-callout .icon{margin-top:1px;color:var(--subtle)}
.inspectNote{margin-top:9px;color:var(--muted);font-size:10px;line-height:1.65}
.empty{grid-column:1/-1;display:grid;justify-items:center;gap:10px;padding:70px 20px;color:var(--muted);font-size:12px;text-align:center}.empty strong{color:var(--text);font-size:14px}.empty .toolbtn{margin-top:2px}
.toast{position:fixed;left:50%;bottom:22px;z-index:100;max-width:min(520px,calc(100vw - 32px));padding:11px 16px;border:1px solid #41516a;border-radius:9px;background:#26354e;color:#fff;font-size:12px;box-shadow:0 12px 34px rgba(20,32,55,.28);opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:opacity .16s,transform .16s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{border-color:#a74545;background:#6f2d2d}
.app.boardmode .assetgrid{display:block;columns:270px;column-gap:14px}.app.boardmode .asset{display:inline-block;width:100%;margin-bottom:14px;break-inside:avoid}.app.boardmode .cover{aspect-ratio:var(--ar)}.app.boardmode .assetinfo{padding:10px 11px 11px}.app.boardmode .assetinfo .tags{display:none}
.app.listmode .assetgrid{display:flex;flex-direction:column;gap:7px}.app.listmode .asset{display:flex;min-height:102px;align-items:stretch}.app.listmode .cover{width:145px;min-height:101px;flex:none;aspect-ratio:auto;border-right:1px solid var(--line);border-bottom:0}.app.listmode .assetinfo{display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(120px,.8fr) auto;column-gap:16px;align-items:center;flex:1;padding:12px 42px 12px 15px}.app.listmode .origin{padding:0}.app.listmode .tags{margin:0}.app.listmode .assetfoot{margin:0;padding:0;border:0}.app.listmode .multi{right:9px}.app.listmode .mark{display:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{border:3px solid transparent;border-radius:10px;background:color-mix(in srgb,var(--subtle) 46%,transparent);background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--muted) 62%,transparent);background-clip:padding-box}
#updateDialog{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,25,37,.48)}#updateDialog.open{display:flex}#updateDialog .panel{width:100%;max-width:435px;padding:23px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);box-shadow:var(--shadow)}#updateDialog h2{margin:0 0 12px;font-size:18px}#updateDialog p{overflow-wrap:anywhere;white-space:pre-line;font-size:13px;line-height:1.7}#updateDialog .row{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
@media(max-width:1180px){.appbody{grid-template-columns:172px minmax(0,1fr) 224px}.toolbar{gap:8px;padding-inline:12px}.brand{min-width:145px}.search-wrap{margin-left:0}.toolbtn{padding-inline:9px}.main{padding-inline:16px}}
@media(max-width:900px){.appbody{grid-template-columns:140px minmax(0,1fr) 190px}.native-actions .mode{max-width:270px}.app.boardmode .assetgrid{columns:200px}.brand{min-width:125px}.brand small{display:none}.main{padding-inline:10px}.inspector{padding-inline:10px}}
@media(max-width:760px){.toolbar{flex-wrap:wrap}.search-wrap{order:2;width:100%;max-width:none}.appbody{grid-template-columns:140px minmax(0,1fr)}.inspector{display:none}.native-actions{overflow-x:auto}.native-actions .mode{display:none}.main{padding:14px 10px}.app.listmode .assetinfo{display:block}.app.listmode .tags{margin-top:6px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
/* Shortest-column masonry: count-aware, image-ratio-aware, and resized by app.js. */
.app.boardmode .assetgrid{position:relative;display:block;columns:auto;column-gap:normal}
.app.boardmode .asset{position:absolute;display:block;margin:0;break-inside:auto}
.app.boardmode .cover{height:auto;aspect-ratio:var(--ar)}
.app.boardmode .cover img,.inspectCover img{object-fit:contain}
.asset,.inspectCover{user-select:none}.cover img,.inspectCover img{-webkit-user-drag:none}
.app.gridmode .assetgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--card-size,260px)),var(--card-size,260px)))}
.app.listmode .cover{width:calc(var(--card-size,260px) * .55);min-height:calc(var(--card-size,260px) * .4)}
</style>
</head>

<div class="wrap">
  <div class="app boardmode" id="app" data-ui-contract="issue-32">
    <header class="toolbar">
      <div class="logo" aria-hidden="true">T</div>
      <div class="brand"><b>3D 素材管理器</b><small>本地素材 · V2 Windows 预览</small></div>
      <label class="search-wrap" for="search"><svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg><input id="search" type="search" aria-label="搜索素材" placeholder="搜索模型名称、分类、文件夹…" autocomplete="off"></label>
      <div class="spacer"></div>
      <button class="toolbtn" id="theme" type="button" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg><span class="button-label">深色</span></button>
      <button class="toolbtn" id="checkUpdate" type="button" data-capability="checkForUpdates" disabled title="更新服务尚未接入"><svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg><span>检查更新</span></button>
      <button class="toolbtn primary" id="importFolder" type="button" data-capability="importFolder" disabled title="真实素材库尚未接入"><svg class="icon" aria-hidden="true"><use href="#i-folder-plus"></use></svg><span>导入素材文件夹</span></button>
    </header>
    <div class="native-actions">
      <button class="toolbtn" id="pasteCover" type="button" data-capability="setCoverFromClipboard" disabled title="真实素材库尚未接入"><svg class="icon" aria-hidden="true"><use href="#i-clipboard"></use></svg><span>粘贴封面</span></button>
      <button class="toolbtn" id="findImage" type="button" data-capability="searchSimilarClipboard" disabled title="真实素材库尚未接入"><svg class="icon" aria-hidden="true"><use href="#i-image-search"></use></svg><span>以图搜图</span></button>
      <button class="toolbtn" id="showAll" type="button"><svg class="icon" aria-hidden="true"><use href="#i-library"></use></svg><span>全部素材</span></button>
      <button class="toolbtn" id="locateFile" type="button" data-capability="locateAsset" disabled title="真实素材库尚未接入"><svg class="icon" aria-hidden="true"><use href="#i-locate"></use></svg><span>定位原文件</span></button>
      <span class="mode" id="nativeMode" data-state="offline" role="status"><span class="status-dot" aria-hidden="true"></span><span class="mode-text">合成数据 · 未连接真实素材库</span></span>
    </div>
    <div class="appbody">
      <aside class="nav" aria-label="素材导航">
        <div class="navtitle">素材库</div>
        <div id="special-nav"></div>
        <div class="split"></div>
        <div class="navtitle" id="nav-label">虚拟分类</div>
        <div id="category-nav"></div>
        <button class="addcat" id="addCategory" type="button" disabled title="真实分类服务尚未接入"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg><span>新建分类</span></button>
        <div class="navfoot" id="navFoot">当前仅显示合成测试素材。<br>未读取、移动或修改本机文件。</div>
      </aside>
      <main class="main" id="mainContent">
        <div class="maintop">
          <div><h2 id="pageName">全部素材</h2><p id="pageCount">加载中…</p></div>
          <div class="viewbtns" role="group" aria-label="素材布局">
            <button id="gridBtn" type="button" aria-label="网格布局" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-grid"></use></svg></button>
            <button id="listBtn" type="button" aria-label="列表布局" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-list"></use></svg></button>
            <button id="boardBtn" class="active" type="button" aria-label="瀑布流布局" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-board"></use></svg></button>
          </div>
        </div>
        <div class="chips" id="chips" aria-label="分类筛选"></div>
        <div class="hintline" id="hintline"></div>
        <div class="batchbar" id="batchbar" style="display:none"></div>
        <div class="assetgrid" id="assets" role="list" aria-label="合成素材"></div>
      </main>
      <aside class="inspector" id="inspector" aria-label="素材详情"><h3>素材详情</h3><div id="detail"></div></aside>
    </div>
  </div>
</div>
<div id="updateDialog" role="dialog" aria-modal="true" aria-labelledby="updateTitle"><div class="panel"><h2 id="updateTitle">检查软件更新</h2><p id="updateStatus" role="status">准备检查更新…</p><div class="row"><button class="toolbtn" id="closeUpdate" type="button">关闭</button><button class="toolbtn primary" id="nativeUpdate" type="button" disabled>立即更新并重启</button></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="./bridge.js"></script>
<script src="./app.js"></script>
</body>
</html>
