name: Verify native OTA release integrity

on:
  push:
    branches:
      - main
      - codex/verify-ota-manifest-release
    paths:
      - desktop-updates/native/latest.json
      - desktop-updates/native/app-v*.ps1
      - .github/workflows/verify-native-ota-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version, immutable GitHub URL, local bytes and remote SHA256
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re, urllib.request, urllib.parse

          repo_root=pathlib.Path.cwd()
          manifest=json.loads((repo_root/'desktop-updates/native/latest.json').read_text(encoding='utf-8'))
          assert manifest['schema'] == 1, 'Unsupported manifest schema'
          version=manifest['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+',version), 'Invalid semantic version'
          want=manifest['sha256'].lower()
          assert re.fullmatch(r'[0-9a-f]{64}',want), 'Invalid SHA256'
          url=manifest['scriptUrl']
          parsed=urllib.parse.urlsplit(url)
          assert parsed.scheme=='https' and parsed.netloc=='raw.githubusercontent.com', 'Untrusted update host'
          assert not parsed.query and not parsed.fragment, 'Update URL must be immutable'
          match=re.fullmatch(
            rf'/lvbihiu-ctrl/3d-asset-library/[0-9a-f]{{40}}/desktop-updates/native/app-v{re.escape(version)}\.ps1',
            parsed.path)
          assert match, 'URL must reference an immutable full commit SHA and the same version'
          local=repo_root/('desktop-updates/native/app-v'+version+'.ps1')
          assert local.is_file(), 'Versioned script missing from repository'
          script=local.read_bytes()
          assert hashlib.sha256(script).hexdigest()==want, 'Local PS1 byte hash mismatches manifest'
          assert ("$script:version = '"+version+"'").encode('utf-8') in script, 'Script self-version mismatches manifest'
          request=urllib.request.Request(url,headers={'User-Agent':'3DAssetLibrary-Release-Validator'})
          with urllib.request.urlopen(request,timeout=35) as f:
              remote=f.read()
          assert hashlib.sha256(remote).hexdigest()==want, 'Immutable remote download hash mismatches manifest'
          print(f'PASS OTA release {version}; SHA256 {want}; {len(script)} bytes; local and pinned remote verified')
          PY
