name: Validate preview update UI contract
on:
  pull_request:
    paths:
      - 'desktop-updates/native/preview/webview2-update/**'
      - '.github/workflows/validate-ui-update-bridge-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test desktop-updates/native/preview/webview2-update/bridge.test.cjs
